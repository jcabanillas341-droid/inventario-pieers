<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PIEERS PRO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PIEERS PRO">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="PIEERS PRO">
    <meta name="description" content="Auditoría y almacén de inventario profesional">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap');

        :root {
            --rojo: #D32F2F;
            --rojo-dark: #B71C1C;
            --rojo-light: #EF5350;
            --negro: #111111;
            --negro-soft: #1E1E1E;
            --gris-borde: #E0E0E0;
            --gris-bg: #F5F5F5;
            --gris-mid: #9E9E9E;
            --blanco: #FFFFFF;
            --texto: #1A1A1A;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Barlow', sans-serif;
            background: var(--blanco);
            color: var(--texto);
            margin: 0; display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
        }

        /* ── SELECTOR DE MODO ── */
        #pantalla-modo {
            position: fixed; inset: 0; background: var(--negro); z-index: 9000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            gap: 14px; padding: 24px;
        }
        .logo-modo { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 900; color: var(--blanco); letter-spacing: 3px; text-align: center; text-transform: uppercase; margin-bottom: 4px; }
        .logo-acento { color: var(--rojo); }
        .logo-sub { font-size: 12px; color: #666; text-align: center; margin-bottom: 8px; letter-spacing: 1px; }
        .logo-v { font-size: 10px; color: #444; text-align: center; margin-top: -8px; }

        .btn-modo { width: 100%; padding: 18px 16px; border: none; border-radius: 12px; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 14px; transition: transform 0.1s, filter 0.1s; }
        .btn-modo:active { transform: scale(0.97); }
        .btn-modo .ico { font-size: 30px; min-width: 36px; text-align: center; }
        .btn-modo .txt { display: flex; flex-direction: column; }
        .btn-modo .tit { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        .btn-modo .desc { font-size: 11px; font-weight: 400; margin-top: 3px; opacity: 0.85; line-height: 1.4; }
        .btn-comp { background: #1a1a1a; color: white; border: 2px solid #333; }
        .btn-comp:hover { border-color: var(--rojo); }
        .btn-alm  { background: var(--rojo); color: white; border: 2px solid var(--rojo-dark); }
        .btn-alm:hover { filter: brightness(1.1); }

        /* ── CABECERA ── */
        .header-app { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: var(--negro); border-bottom: 3px solid var(--rojo); flex-shrink: 0; position: relative; }
        .header-logo { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 900; color: var(--blanco); letter-spacing: 1px; }
        .logo-red { color: var(--rojo); }
        .badge-modo { font-size: 9px; padding: 2px 8px; border-radius: 10px; color: white; background: var(--rojo); margin-left: 6px; letter-spacing: 0.5px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; }
        .btn-menu { background: var(--rojo); color: white; border: none; padding: 7px 11px; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 1px; }
        .btn-cambio { background: #2a2a2a; color: #aaa; border: 1px solid #444; padding: 7px 10px; border-radius: 6px; font-size: 10px; cursor: pointer; }

        .menu-dropdown { display: none; position: absolute; right: 10px; top: 52px; background: var(--negro-soft); z-index: 5000; border: 1px solid #333; border-radius: 10px; min-width: 280px; max-width: calc(100vw - 20px); overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); max-height: calc(100vh - 70px); overflow-y: auto; }
        .menu-section { padding: 8px 14px 5px; font-size: 10px; color: #888; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; border-top: 1px solid #2a2a2a; }
        .menu-section:first-child { border-top: none; }
        .menu-dropdown button { width: 100%; padding: 15px 16px; background: none; border: none; color: #ddd; text-align: left; border-bottom: 1px solid #2a2a2a; cursor: pointer; font-size: 14px; font-family: 'Barlow', sans-serif; display: flex; align-items: center; gap: 8px; min-height: 48px; }
        .menu-dropdown button:active { background: #2a2a2a; }
        .menu-dropdown button:last-child { border-bottom: none; }
        .menu-btn-danger { color: var(--rojo-light) !important; }

        /* ── SCANNER INPUT ── */
        #scanner { width: 96%; margin: 6px auto; display: block; padding: 11px 10px; font-size: 18px; border-radius: 10px; border: 3px solid var(--rojo); text-align: center; background: var(--blanco); color: var(--negro); flex-shrink: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 2px; }

        /* ── PROGRESO ── */
        .progress-box { background: var(--negro-soft); padding: 8px 10px; margin: 0 8px 6px; border-radius: 10px; border: 1px solid #2a2a2a; flex-shrink: 0; }
        .stats-grid   { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .stat-val     { display: block; font-size: 22px; color: var(--rojo-light); text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; }
        .stat-lab     { font-size: 8px; color: #666; text-transform: uppercase; text-align: center; letter-spacing: 0.5px; }
        .bar-bg       { background: #2a2a2a; height: 8px; border-radius: 4px; overflow: hidden; }
        #bar-fill     { background: linear-gradient(90deg, var(--rojo-dark), var(--rojo-light)); height: 100%; width: 0%; transition: width 0.3s; }

        /* ── TOAST ── */
        #toast { display: none; position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--negro); color: white; padding: 10px 20px; border-radius: 20px; font-size: 12px; z-index: 8000; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; font-family: 'Barlow', sans-serif; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,0.3); border-left: 4px solid var(--rojo); }

        /* ── PANELES ── */
        .split-view { display: flex; flex: 1; gap: 6px; overflow: hidden; padding: 0 8px 8px; min-height: 0; }
        .panel      { flex: 1; display: flex; flex-direction: column; background: var(--blanco); border-radius: 10px; overflow: hidden; border: 1px solid var(--gris-borde); }
        .panel-h    { background: var(--negro); padding: 7px 8px; font-size: 10px; text-align: center; color: var(--blanco); flex-shrink: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; border-bottom: 2px solid var(--rojo); }
        .scroll     { flex: 1; overflow-y: auto; background: white; -webkit-overflow-scrolling: touch; }

        table  { width: 100%; border-collapse: collapse; color: var(--texto); table-layout: fixed; }
        th     { background: var(--negro); color: #ccc; padding: 6px 4px; font-size: 9px; position: sticky; top: 0; z-index: 10; text-transform: uppercase; letter-spacing: 0.5px; }
        td     { padding: 9px 4px; border-bottom: 1px solid var(--gris-borde); text-align: center; font-size: 12px; font-weight: 600; }

        .match    { background: #E8F5E9 !important; color: #1B5E20; }
        .falta    { background: #FFF8E1 !important; color: #E65100; }
        .sobrante { background: #FFEBEE !important; color: #B71C1C; }

        /* ── OVERLAY ERROR ── */
        #overlay-error { display: none; position: fixed; inset: 0; background: rgba(183,28,28,0.97); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }

        /* ── MODALES ── */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 5500; padding: 14px; flex-direction: column; }
        .modal-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 20px; color: var(--rojo); text-align: center; margin-bottom: 12px; letter-spacing: 1px; text-transform: uppercase; }
        .card-lote  { background: #1a1a1a; padding: 14px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid var(--rojo); }
        .hidden     { display: none !important; }

        

        /* ── MODAL BÚSQUEDA ── */
        #modal-busqueda { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 6000; justify-content: center; align-items: flex-start; padding: 30px 16px 16px; }
        .busq-card { background: var(--blanco); border-radius: 14px; width: 100%; max-width: 420px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.4); border-top: 4px solid var(--rojo); }
        .busq-header { background: var(--negro); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
        .busq-title { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 900; color: var(--blanco); letter-spacing: 1px; text-transform: uppercase; }
        .busq-close { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; padding: 0 4px; }
        .busq-body { padding: 14px; }
        .busq-label { font-size: 10px; font-weight: 700; color: var(--gris-mid); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; display: block; }
        .busq-select { width: 100%; padding: 9px 10px; border-radius: 8px; border: 2px solid var(--gris-borde); background: var(--gris-bg); color: var(--texto); font-size: 13px; font-family: 'Barlow', sans-serif; margin-bottom: 10px; cursor: pointer; }
        .busq-select:focus { outline: none; border-color: var(--rojo); }
        .busq-input-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
        #busq-input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 2px solid var(--gris-borde); background: var(--blanco); color: var(--texto); font-size: 14px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 1px; }
        #busq-input:focus { outline: none; border-color: var(--rojo); }
        #busq-input::placeholder { color: #bbb; font-weight: 400; font-size: 13px; letter-spacing: 0; }
        .busq-btn-ok { padding: 10px 14px; border: none; border-radius: 8px; background: var(--rojo); color: white; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .busq-btn-ok:active { filter: brightness(0.85); }
        #busq-resultados { max-height: 220px; overflow-y: auto; border-radius: 8px; border: 1px solid var(--gris-borde); background: var(--gris-bg); }
        .busq-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--gris-borde); cursor: pointer; transition: background 0.1s; }
        .busq-item:last-child { border-bottom: none; }
        .busq-item:hover { background: #FFEBEE; }
        .busq-item:active { background: #FFCDD2; }
        .busq-item-desc { font-size: 12px; color: var(--texto); font-weight: 600; flex: 1; margin-right: 8px; line-height: 1.3; }
        .busq-item-stock { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 900; min-width: 32px; text-align: right; }
        .busq-item-cod { font-size: 9px; color: var(--gris-mid); display: block; margin-top: 1px; }
        .busq-empty { padding: 20px; text-align: center; color: var(--gris-mid); font-size: 12px; }
        .busq-footer { padding: 10px 14px; background: var(--gris-bg); border-top: 1px solid var(--gris-borde); display: flex; justify-content: space-between; align-items: center; }
        .busq-total-label { font-size: 10px; color: var(--gris-mid); text-transform: uppercase; letter-spacing: 1px; }
        .busq-total-val { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 900; color: var(--rojo); }

        /* ── MODAL RETIRO / INGRESO ── */
        #modal-movimiento { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 6000; justify-content: center; align-items: center; padding: 16px; }
        .mov-card { background: var(--blanco); border-radius: 14px; width: 100%; max-width: 360px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
        .mov-header { padding: 13px 16px; display: flex; justify-content: space-between; align-items: center; }
        .mov-header.retiro  { background: var(--negro); border-bottom: 3px solid #FF5252; }
        .mov-header.ingreso { background: var(--rojo); border-bottom: 3px solid var(--rojo-dark); }
        .mov-title { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 900; color: var(--blanco); letter-spacing: 1px; text-transform: uppercase; }
        .mov-close { background: rgba(255,255,255,0.15); border: none; color: white; font-size: 15px; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
        .mov-body { padding: 14px; }
        .mov-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
        .mov-tab { flex: 1; padding: 9px 6px; border: 2px solid var(--gris-borde); border-radius: 8px; background: var(--gris-bg); color: var(--gris-mid); cursor: pointer; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.15s; }
        .mov-tab.activo { background: var(--negro); color: var(--blanco); border-color: var(--negro); }
        .mov-scanner-label { font-size: 9px; color: var(--gris-mid); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 3px; }
        #mov-scanner { width: 100%; padding: 11px 12px; border-radius: 8px; font-size: 16px; border: 2px solid var(--gris-borde); background: var(--gris-bg); color: var(--texto); text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 2px; margin-bottom: 0; }
        #mov-scanner:focus { outline: none; border-color: var(--rojo); }
        #mov-scanner::placeholder { color: #bbb; font-weight: 400; font-size: 13px; letter-spacing: 0; }
        .mov-manual-inp { width: 100%; padding: 10px 12px; border-radius: 8px; font-size: 14px; border: 2px solid var(--gris-borde); background: var(--gris-bg); color: var(--texto); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
        .mov-manual-inp:focus { outline: none; border-color: var(--rojo); }
        .mov-manual-inp::placeholder { color: #bbb; font-weight: 400; letter-spacing: 0; font-size: 13px; }
        .mov-manual-row { display: flex; gap: 6px; margin-bottom: 8px; }
        .mov-manual-desc { flex: 1; padding: 9px 12px; border-radius: 8px; font-size: 13px; border: 2px solid var(--gris-borde); background: var(--gris-bg); color: var(--texto); font-family: 'Barlow', sans-serif; }
        .mov-manual-desc:focus { outline: none; border-color: var(--rojo); }
        .mov-manual-desc::placeholder { color: #bbb; }
        .mov-manual-cant { width: 80px; padding: 9px 10px; border-radius: 8px; font-size: 14px; border: 2px solid var(--gris-borde); background: var(--gris-bg); color: var(--texto); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; text-align: center; }
        .mov-manual-cant:focus { outline: none; border-color: var(--rojo); }
        .mov-btn-aplicar { width: 100%; padding: 14px; border: none; border-radius: 10px; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; margin-top: 10px; transition: filter 0.15s; }
        .mov-btn-aplicar.retiro  { background: var(--negro); color: white; }
        .mov-btn-aplicar.ingreso { background: var(--rojo); color: white; }
        .mov-btn-aplicar:active { filter: brightness(0.85); }
        .mov-btn-cancelar { width: 100%; padding: 10px; border: none; background: none; color: var(--gris-mid); font-size: 13px; cursor: pointer; margin-top: 4px; font-family: 'Barlow', sans-serif; }

        /* ── LOADING OVERLAY ── */
        #loading-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 8500; flex-direction: column; justify-content: center; align-items: center; gap: 16px; }
        .spinner { width: 44px; height: 44px; border: 4px solid #2a2a2a; border-top-color: var(--rojo); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-txt { font-size: 13px; color: #aaa; font-family: 'Barlow', sans-serif; }

        /* ── PANEL DESCRIPCIÓN ── */
        #panel-desc { display: none; margin: 0 8px 4px; background: #fff0f0; border: 1px solid var(--rojo); border-radius: 8px; padding: 6px 12px; flex-shrink: 0; }

        /* ── PANEL ALMACÉN EN COMPARATIVO ── */
        #panel-alm-comp { display: none; margin: 0 8px 4px; background: #0a1a0a; border: 2px solid #2E7D32; border-radius: 8px; padding: 8px 12px; flex-shrink: 0; flex-direction: column; gap: 2px; }
        #panel-alm-comp.visible { display: flex; }
        .pac-row { display: flex; align-items: center; gap: 8px; }
        .pac-ico  { font-size: 16px; flex-shrink: 0; }
        .pac-cod  { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; color: #888; letter-spacing: 1px; }
        .pac-desc { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; color: #ccc; flex: 1; line-height: 1.3; }
        .pac-stock-badge { background: #1B5E20; color: white; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 900; padding: 3px 12px; border-radius: 6px; letter-spacing: 1px; flex-shrink: 0; }
        .pac-stock-badge.cero { background: #B71C1C; }
        .pac-stock-badge.bajo { background: #E65100; }
        .pac-label { font-size: 9px; color: #4CAF50; text-transform: uppercase; letter-spacing: 1px; font-family: 'Barlow', sans-serif; }

        /* ── MINI MODAL ALMACÉN DESDE COMPARATIVO ── */
#modal-alm-desde-comp {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.92); z-index: 6000;
    flex-direction: column;
}
#modal-alm-desde-comp .madc-header {
    background: var(--negro); padding: 10px 14px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 3px solid #2E7D32; flex-shrink: 0;
}
#modal-alm-desde-comp .madc-title {
    font-family: 'Barlow Condensed', sans-serif; font-size: 15px;
    font-weight: 900; color: white; letter-spacing: 1px; flex: 1;
}
#modal-alm-desde-comp .madc-close {
    background: none; border: none; color: #aaa; font-size: 22px; cursor: pointer;
}
.madc-tabs {
    display: flex; gap: 0; flex-shrink: 0;
    background: #0a0a0a; border-bottom: 1px solid #1a1a1a;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.madc-tab {
    flex: 1; padding: 9px 6px; border: none;
    background: transparent; color: #666;
    font-family: 'Barlow Condensed', sans-serif; font-size: 11px;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
    cursor: pointer; white-space
