<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pieers Inventario Black</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <style>
        /* FONDO NEGRO Y ESTILO OSCURO */
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #000000; color: #ffffff; padding: 15px; margin: 0; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; overflow: hidden; }
        
        /* MENÚ HAMBURGUESA (3 LÍNEAS) */
        .top-bar { display: flex; justify-content: flex-start; align-items: center; padding-top: 25px; margin-bottom: 10px; flex-shrink: 0; }
        .menu-icon { cursor: pointer; display: flex; flex-direction: column; gap: 5px; width: 30px; z-index: 1001; }
        .menu-icon div { width: 100%; height: 4px; background-color: #3498db; border-radius: 2px; }

        /* PANEL LATERAL */
        .side-menu { position: fixed; top: 0; left: -250px; width: 250px; height: 100%; background: #1a1a1a; transition: 0.3s; z-index: 1000; padding-top: 80px; box-shadow: 2px 0 10px rgba(0,0,0,0.5); }
        .side-menu.open { left: 0; }
        .menu-btn { width: 90%; margin: 10px auto; display: block; padding: 15px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; text-align: left; }
        .btn-limpiar { background: #444; }
        .btn-exportar { background: #3498db; }

        /* CONTENEDORES */
        .total-container { background: #1a1a1a; border-radius: 12px; display: flex; flex-direction: column; align-items: center; padding: 10px; margin-bottom: 10px; flex-shrink: 0; border-top: 5px solid #3498db; }
        .total-numero { font-size: 50px; font-weight: bold; color: #2ecc71; line-height: 1; }
        .ultimo-codigo-panel { background: #333; color: #ecf0f1; width: 100%; text-align: center; padding: 8px; border-radius: 8px; margin-bottom: 10px; flex-shrink: 0; }
        .ultimo-valor { font-family: monospace; font-size: 22px; font-weight: bold; color: #f1c40f; display: block; }
        
        #scanner { width: 100%; padding: 15px; font-size: 18px; border-radius: 10px; border: 2px solid #333; background: #222; color: white; outline: none; margin-bottom: 8px; box-sizing: border-box; text-align: center; }

        .excel-container { flex-grow: 1; overflow-y: auto; background: #111; border-radius: 10px; border: 1px solid #333; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #222; color: #888; padding: 10px; font-size: 12px; }
        td { padding: 12px; border-bottom: 1px solid #222; text-align: center; font-size: 14px; color: #ccc; }

        /* RESALTADO DE LOS ÚLTIMOS 2 CÓDIGOS */
        .resaltado-1 { background-color: rgba(52, 152, 219, 0.4) !important; color: #fff !important; }
        .resaltado-2 { background-color: rgba(52, 152, 219, 0.15) !important; color: #ddd !important; }

        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 999; }
    </style>
</head>
<body>

    <div id="overlay" onclick="toggleMenu()"></div>

    <div class="top-bar">
        <div class="menu-icon" onclick="toggleMenu()">
            <div></div><div></div><div></div>
        </div>
        <div style="margin-left: 15px; font-weight: bold; color: #3498db;">PIEERS INVENTARIO</div>
    </div>

    <div id="sideMenu" class="side-menu">
        <button class="menu-btn btn-limpiar" onclick="resetearTodo()">🗑️ BORRAR TODO</button>
        <button class="menu-btn btn-exportar" onclick="exportar()">💾 EXPORTAR TXT</button>
    </div>

    <div class="total-container">
        <div style="font-size: 12px; font-weight: bold; color: #888;">TOTAL UNIDADES</div>
        <div class="total-numero" id="total">0</div>
    </div>

    <div class="ultimo-codigo-panel">
        ÚLTIMO REGISTRO: <span id="ultimo-valor" class="ultimo-valor">---</span>
    </div>

    <input id="scanner" inputmode="none" autofocus placeholder="ESCANEE AQUÍ" autocomplete="off">

    <div class="excel-container">
        <table>
            <thead>
                <tr>
                    <th style="text-align:left">CÓDIGO</th>
                    <th>CANT.</th>
                    <th>ELIM.</th>
                </tr>
            </thead>
            <tbody id="tabla"></tbody>
        </table>
    </div>

    <script>
        let inventario = JSON.parse(localStorage.getItem("inv_data")) || {};
        let totalGeneral = parseInt(localStorage.getItem("inv_total")) || 0;
        let historialCodigos = []; 

        const inputScanner = document.getElementById("scanner");
        const totalDisplay = document.getElementById("total");
        const ultimoValorTxt = document.getElementById("ultimo-valor");
        const tablaCuerpo = document.getElementById("tabla");
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        window.onload = () => {
            totalDisplay.innerText = totalGeneral;
            actualizarTablaUI();
            inputScanner.focus();
        };

        function toggleMenu() {
            const menu = document.getElementById("sideMenu");
            const overlay = document.getElementById("overlay");
            menu.classList.toggle("open");
            overlay.style.display = menu.classList.contains("open") ? "block" : "none";
        }

        // ENTER AUTOMÁTICO: Escucha cuando el lector envía la información
        inputScanner.addEventListener("input", function() {
            clearTimeout(window.scanTimeout);
            window.scanTimeout = setTimeout(() => {
                let cod = inputScanner.value.trim();
                if (cod.length >= 10) { // Registra automáticamente al detectar el código
                    registrar(cod);
                    inputScanner.value = ""; 
                }
            }, 50); // Ajuste de milisegundos para captura inmediata
        });

        function registrar(codigo) {
            totalGeneral++;
            totalDisplay.innerText = totalGeneral;
            ultimoValorTxt.innerText = codigo;
            
            // Actualizar historial de los 2 últimos para el resaltado
            historialCodigos = [codigo, historialCodigos[0]].slice(0, 2);

            if (inventario[codigo]) {
                inventario[codigo]++;
            } else {
                inventario[codigo] = 1;
            }
            
            sonar(800, 0.08);
            localStorage.setItem("inv_data", JSON.stringify(inventario));
            localStorage.setItem("inv_total", totalGeneral.toString());
            actualizarTablaUI();
        }

        function actualizarTablaUI() {
            tablaCuerpo.innerHTML = "";
            let claves = Object.keys(inventario).reverse();
            
            claves.forEach(codigo => {
                let fila = document.createElement("tr");
                
                // Aplicar colores de resaltado
                if (codigo === historialCodigos[0]) fila.className = "resaltado-1";
                else if (codigo === historialCodigos[1]) fila.className = "resaltado-2";

                fila.innerHTML = `
                    <td style="text-align:left"><b>${codigo}</b></td>
                    <td><b style="color:#2ecc71">${inventario[codigo]}</b></td>
                    <td><button style="background:transparent; color:#e74c3c; border:1px solid #e74c3c; padding:2px 8px; border-radius:4px;" onclick="restar('${codigo}')">-1</button></td>
                `;
                tablaCuerpo.appendChild(fila);
            });
        }

        function sonar(freq, dur) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + dur);
        }

        function restar(cod) {
            if (inventario[cod] > 1) inventario[cod]--;
            else delete inventario[cod];
            totalGeneral--;
            totalDisplay.innerText = totalGeneral;
            localStorage.setItem("inv_data", JSON.stringify(inventario));
            localStorage.setItem("inv_total", totalGeneral.toString());
            actualizarTablaUI();
        }

        function resetearTodo() {
            if(confirm("¿BORRAR TODO EL INVENTARIO?")){
                localStorage.clear();
                location.reload();
            }
        }

        function exportar() {
            let datos = Object.entries(inventario);
            if (datos.length === 0) return alert("Sin datos.");
            let texto = ""; 
            datos.forEach(([c, q]) => { texto += `${c}|${q}\n`; });
            const blob = new Blob([texto], { type: "text/plain" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `inventario.txt`;
            link.click();
            toggleMenu();
        }

        document.addEventListener("click", (e) => {
            if (e.target.tagName !== 'BUTTON' && !e.target.closest('.side-menu') && !e.target.closest('.menu-icon')) {
                inputScanner.focus();
            }
        });
    </script>
</body>
</html>
