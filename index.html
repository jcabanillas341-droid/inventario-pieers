<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pieers Inventario Cloud</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #121212; 
            color: #e0e0e0;
            padding: 15px; margin: 0; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; overflow: hidden; 
        }

        /* Pantalla de Login */
        #login-screen {
            position: fixed; top:0; left:0; width:100%; height:100%; background:#121212;
            z-index: 5000; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .login-box { background:#1e1e1e; padding:30px; border-radius:15px; border-top: 5px solid #3498db; width:80%; max-width:350px; text-align:center; }
        .login-box input { width:100%; padding:15px; margin:15px 0; border-radius:8px; border:none; font-size:16px; text-align:center; }

        /* App Content */
        #app-content { display: none; flex-direction: column; height: 100%; }

        .menu-container { position: fixed; top: 15px; right: 15px; z-index: 2000; }
        .hamburger { width: 35px; height: 30px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
        .hamburger div { width: 100%; height: 4px; background-color: #3498db; border-radius: 2px; }
        
        .menu-content {
            display: none; position: absolute; right: 0; top: 40px; background: #1e1e1e; 
            min-width: 180px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); border-radius: 8px; overflow: hidden;
        }
        .menu-content button {
            width: 100%; border: none; padding: 15px 16px; text-align: left; background: none; color: white;
            font-size: 14px; cursor: pointer; border-bottom: 1px solid #333;
        }
        .menu-content.show { display: block; }

        .total-container { 
            background: #1e1e1e; border-radius: 12px; padding: 10px; margin-bottom: 10px; 
            flex-shrink: 0; border-top: 5px solid #3498db; text-align: center;
        }
        .total-numero { font-size: 50px; font-weight: bold; color: #2ecc71; line-height: 1; }
        
        #scanner { 
            width: 100%; padding: 15px; font-size: 18px; border-radius: 10px; border: 3px solid #3498db; 
            outline: none; margin-bottom: 8px; text-align: center; background: #fff; color: #333;
        }

        .excel-container { flex-grow: 1; overflow-y: auto; background: white; border-radius: 10px; border: 1px solid #ddd; }
        table { width: 100%; border-collapse: collapse; color: #333; }
        th { background: #2c3e50; color: white; padding: 10px; font-size: 13px; position: sticky; top: 0; }
        td { padding: 10px; border: 1px solid #eee; text-align: center; }

        #alerta-inferior { 
            display: none; position: fixed; bottom: 0; left: 0; width: 100%; 
            background: #e74c3c; color: white; padding: 15px; text-align: center; z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="color:#3498db">PIEERS INVENTARIO</h2>
            <input type="text" id="username" placeholder="Nombre de usuario" autocomplete="off">
            <button onclick="login()" style="width:100%; padding:15px; background:#2ecc71; border:none; color:white; font-weight:bold; border-radius:8px;">ENTRAR</button>
        </div>
    </div>

    <div id="app-content">
        <div class="menu-container">
            <div class="hamburger" onclick="toggleMenu()"><div></div><div></div><div></div></div>
            <div id="menuContent" class="menu-content">
                <button onclick="guardarLote()">💾 GUARDAR LOTE</button>
                <button onclick="verGrupos()">📂 VER GRUPOS</button>
                <button onclick="location.reload()">👤 CAMBIAR USUARIO</button>
            </div>
        </div>

        <div style="font-size:10px; color:#3498db; margin-bottom:5px;" id="user-display"></div>
        
        <div class="total-container">
            <div style="font-size: 12px; font-weight: bold; color: #bdc3c7;">UNIDADES EN LOTE</div>
            <div class="total-numero" id="total">0</div>
        </div>

        <input id="scanner" inputmode="none" autofocus placeholder="ESCANEE AQUÍ">

        <div class="excel-container">
            <table>
                <thead><tr><th>Código</th><th>Cant.</th><th>X</th></tr></thead>
                <tbody id="tabla"></tbody>
            </table>
        </div>
    </div>

    <div id="alerta-inferior">
        <div id="cod-erroneo"></div>
        <button onclick="desbloquear()" style="background:#f1c40f; padding:10px; border:none; margin-top:10px; font-weight:bold;">CORREGIR</button>
    </div>

    <script>
        // CONFIGURACIÓN: Pon tu URL de Firebase aquí
        const firebaseConfig = { databaseURL: "https://TU-PROYECTO.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let user = "";
        let inventario = [];
        let grupos = [];
        let bloqueado = false;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function login() {
            user = document.getElementById("username").value.trim().toLowerCase();
            if(!user) return alert("Ingresa usuario");
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-content").style.display = "flex";
            document.getElementById("user-display").innerText = "USUARIO: " + user.toUpperCase();
            
            // Cargar datos de la nube
            db.ref('pieers/' + user).on('value', (snap) => {
                const data = snap.val();
                if(data) {
                    inventario = data.actual || [];
                    grupos = data.grupos || [];
                    actualizarUI();
                }
            });
            document.getElementById("scanner").focus();
        }

        function sync() {
            db.ref('pieers/' + user).set({ actual: inventario, grupos: grupos });
        }

        const inputScanner = document.getElementById("scanner");
        inputScanner.addEventListener("input", () => {
            if(bloqueado) return;
            let cod = inputScanner.value.trim();
            if(cod.length === 13) {
                inventario.push(cod);
                sonar(800, 0.08);
                sync();
                inputScanner.value = "";
            } else if(cod.length > 13) {
                lanzarError(cod);
            }
        });

        function actualizarUI() {
            document.getElementById("total").innerText = inventario.length;
            const tabla = document.getElementById("tabla");
            tabla.innerHTML = "";
            // Mostrar últimos 50 para velocidad
            const vista = [...inventario].reverse().slice(0, 50);
            vista.forEach((cod, i) => {
                let row = `<tr><td>${cod}</td><td>1</td><td><button onclick="borrarUno(${inventario.length - 1 - i})" style="background:red; color:white; border:none; border-radius:4px;">X</button></td></tr>`;
                tabla.innerHTML += row;
            });
        }

        function borrarUno(idx) {
            inventario.splice(idx, 1);
            sync();
        }

        function guardarLote() {
            if(inventario.length === 0) return;
            let nombre = prompt("Nombre del lote:");
            if(!nombre) return;
            grupos.push({ nombre: nombre, datos: inventario });
            inventario = [];
            sync();
        }

        function sonar(f, d) {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.frequency.setValueAtTime(f, audioCtx.currentTime);
            g.gain.setValueAtTime(0.05, audioCtx.currentTime);
            o.start(); o.stop(audioCtx.currentTime + d);
        }

        function lanzarError(c) {
            bloqueado = true;
            document.getElementById("cod-erroneo").innerText = "ERROR: " + c;
            document.getElementById("alerta-inferior").style.display = "block";
            sonar(200, 0.5);
        }

        function desbloquear() {
            bloqueado = false;
            document.getElementById("alerta-inferior").style.display = "none";
            inputScanner.value = ""; inputScanner.focus();
        }

        function toggleMenu() { document.getElementById("menuContent").classList.toggle("show"); }
        document.addEventListener("click", (e) => {
            if(!bloqueado && user && e.target.tagName !== 'BUTTON') inputScanner.focus();
        });
    </script>
</body>
</html>
