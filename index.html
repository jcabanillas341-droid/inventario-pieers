<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pieers Inventario Pro - Cloud Sync</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        * {
            font-family: 'Arial Black', 'Arial Bold', Gadget, sans-serif;
            box-sizing: border-box;
        }

        body { 
            background: #121212; 
            color: #e0e0e0;
            padding: 10px; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; 
        }

        /* PANTALLA DE LOGIN */
        #pantalla-login {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #121212; z-index: 5000; display: flex;
            flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }
        .login-card {
            background: #1e1e1e; padding: 30px; border-radius: 15px; border-top: 5px solid #3498db;
            width: 100%; max-width: 400px; text-align: center;
        }
        .login-card input {
            width: 100%; padding: 15px; margin: 15px 0; border-radius: 8px; border: none; font-size: 18px; text-align: center;
        }

        /* CONTENIDO PRINCIPAL (Oculto al inicio) */
        #contenido-app { display: none; flex-direction: column; height: 100%; }

        /* CABECERA */
        .menu-container { position: fixed; top: 10px; right: 10px; z-index: 2000; }
        .hamburger {
            width: 30px; height: 25px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer;
        }
        .hamburger div { width: 100%; height: 4px; background-color: #3498db; border-radius: 2px; }
        
        .menu-content {
            display: none; position: absolute; right: 0; top: 35px; background: #1e1e1e; 
            min-width: 220px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); border-radius: 8px; overflow: hidden;
        }
        .menu-content button {
            width: 100%; border: none; padding: 12px 15px; text-align: left; background: none; color: white;
            font-size: 12px; cursor: pointer; border-bottom: 1px solid #333;
        }
        .menu-content.show { display: block; }

        #scanner { 
            width: 100%; padding: 12px; font-size: 18px; border-radius: 10px; border: 3px solid #3498db; 
            outline: none; margin-bottom: 8px; flex-shrink: 0; text-align: center; background: #fff; color: #333;
        }

        .total-container { 
            background: #1e1e1e; border-radius: 12px; padding: 8px; margin-bottom: 8px; 
            flex-shrink: 0; border-top: 4px solid #3498db; text-align: center;
        }
        .total-numero { font-size: 45px; font-weight: bold; color: #2ecc71; line-height: 1; margin: 5px 0; }
        .total-label { font-size: 12px; color: #bdc3c7; text-transform: uppercase; }
        
        .user-tag { font-size: 10px; color: #3498db; margin-bottom: 5px; }

        .ultimo-codigo-panel { 
            background: #2c3e50; color: #ecf0f1; width: 100%; text-align: center; 
            padding: 6px; border-radius: 8px; margin-bottom: 8px; flex-shrink: 0; font-size: 11px;
        }
        .ultimo-valor { font-family: monospace; font-size: 20px; font-weight: bold; color: #f1c40f; display: block; }
        
        /* TABLA */
        .excel-container { flex-grow: 1; overflow-y: auto; background: white; border-radius: 10px; border: 1px solid #ddd; }
        table { width: 100%; border-collapse: collapse; color: #333; table-layout: fixed; }
        thead { position: sticky; top: 0; z-index: 10; }
        th { background: #2c3e50; color: white; padding: 10px 5px; font-size: 12px; text-transform: uppercase; }
        td { padding: 10px 5px; border: 1px solid #eee; text-align: center; font-size: 14px; background-color: #ffffff; }
        
        td:first-child { background-color: #d4edda; font-weight: bold; width: 60px; } 
        th:nth-child(1) { width: 60px; }
        th:nth-child(3), td:nth-child(3) { width: 70px; }

        /* MODALES */
        .modal-pantalla {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 3000; padding: 15px; flex-direction: column;
        }
        .lista-items { flex-grow: 1; overflow-y: auto; background: #222; border-radius: 8px; padding: 8px; }
        .card-grupo { background: #333; padding: 10px; margin-bottom: 8px; border-left: 4px solid #3498db; }
        
        .resumen-busqueda { background: #2ecc71; color: #000; padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 10px; font-weight: bold; }

        .btn-accion { padding: 10px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; color: white; font-size: 11px; }
        .btn-cerrar { background: #e74c3c; padding: 12px; width: 100%; margin-top: 8px; }

        #alerta-inferior { 
            display: none; position: fixed; bottom: 0; left: 0; width: 100%; 
            background: #e74c3c; color: white; padding: 12px; text-align: center; z-index: 4000;
        }
    </style>
</head>
<body>

    <div id="pantalla-login">
        <div class="login-card">
            <h2 style="color:#3498db; margin:0;">PIEERS INVENTARIO</h2>
            <p style="font-size:12px; color:#888;">INGRESE SU NOMBRE DE USUARIO</p>
            <input type="text" id="user-input" placeholder="Ej: Jorge" autocomplete="off">
            <button class="btn-accion" style="background:#2ecc71; width:100%; padding:15px; font-size:16px;" onclick="iniciarApp()">ENTRAR A MI APP</button>
        </div>
    </div>

    <div id="contenido-app">
        <div class="menu-container">
            <div class="hamburger" onclick="toggleMenu()">
                <div></div><div></div><div></div>
            </div>
            <div id="menuContent" class="menu-content">
                <button onclick="guardarGrupoActual()">💾 GUARDAR GRUPO ACTUAL</button>
                <button onclick="abrirModalGrupos()">📂 VER GRUPOS GUARDADOS</button>
                <button onclick="abrirBuscadorGeneral()">🔍 BUSCADOR GENERAL</button>
                <hr style="border: 0; border-top: 1px solid #444; margin: 0;">
                <button onclick="location.reload()" style="color: #3498db;">👤 CAMBIAR USUARIO</button>
            </div>
        </div>

        <div class="user-tag" id="display-user">Usuario: ---</div>
        <input id="scanner" inputmode="none" autofocus placeholder="ESCANEE AQUÍ" autocomplete="off">

        <div class="total-container">
            <div class="total-label">Total en Lote</div>
            <div class="total-numero" id="total">0</div>
        </div>

        <div class="ultimo-codigo-panel">
            ÚLTIMO: <span id="ultimo-valor" class="ultimo-valor">---</span>
        </div>

        <div class="excel-container">
            <table id="mainTable">
                <thead><tr><th>Item</th><th>Código</th><th>X</th></tr></thead>
                <tbody id="tabla"></tbody>
            </table>
        </div>
    </div>

    <div id="modalGrupos" class="modal-pantalla">
        <h2 style="color: #f1c40f; text-align: center;">GRUPOS GUARDADOS</h2>
        <div id="listaGrupos" class="lista-items"></div>
        <button class="btn-accion btn-cerrar" onclick="cerrarModal('modalGrupos')">VOLVER</button>
    </div>

    <div id="modalDetalle" class="modal-pantalla">
        <h2 id="tituloDetalle" style="color: #3498db; text-align: center;"></h2>
        <div id="resumenDetalle" class="resumen-busqueda" style="display:none;"></div>
        <input id="input-buscar-lote" style="width:100%; padding:10px; margin-bottom:10px; text-align:center;" placeholder="BUSCAR EN ESTE LOTE">
        <div class="excel-container" style="margin-bottom: 8px;">
            <table>
                <thead><tr><th>Item</th><th>Código</th></tr></thead>
                <tbody id="tablaDetalle"></tbody>
            </table>
        </div>
        <button id="btnReanudar" class="btn-accion" style="background:#3498db; width:100%; padding:15px; margin-bottom:5px;">➕ REANUDAR LECTURA AQUÍ</button>
        <button class="btn-accion btn-cerrar" onclick="cerrarDetalle()">VOLVER</button>
    </div>

    <div id="modalBuscadorGeneral" class="modal-pantalla">
        <h2 style="color: #2ecc71; text-align: center;">BUSCADOR GENERAL</h2>
        <div id="resumenGeneral" class="resumen-busqueda" style="display:none;"></div>
        <input id="input-buscar-general" style="width:100%; padding:15px; text-align:center; margin-bottom:10px;" placeholder="ESCANEE PARA BUSCAR">
        <div id="resultadosGeneral" class="lista-items"></div>
        <button class="btn-accion btn-cerrar" onclick="cerrarModal('modalBuscadorGeneral')">CERRAR</button>
    </div>

    <div id="alerta-inferior">
        <div id="cod-erroneo"></div>
        <button onclick="desbloquear()" style="background:#f1c40f; padding:8px; border:none; margin-top:5px; color:black; font-weight:bold;">CORREGIR</button>
    </div>

    <script>
        // CONFIGURACIÓN FIREBASE
        const firebaseConfig = {
            databaseURL: "https://TU-PROYECTO.firebaseio.com" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let usuarioActual = "";
        let historialActual = [];
        let gruposGuardados = [];
        let bloqueado = false;
        let modoModal = false;
        let idxGrupoAbierto = null;

        const inputScanner = document.getElementById("scanner");
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function sonar(freq, dur) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + dur);
        }

        // --- GESTIÓN DE USUARIO Y NUBE ---
        function iniciarApp() {
            usuarioActual = document.getElementById("user-input").value.trim().toLowerCase();
            if (!usuarioActual) return alert("Ingrese un nombre.");

            document.getElementById("pantalla-login").style.display = "none";
            document.getElementById("contenido-app").style.display = "flex";
            document.getElementById("display-user").innerText = "Usuario: " + usuarioActual.toUpperCase();

            // Sincronización en tiempo real con Firebase
            db.ref('usuarios/' + usuarioActual).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    historialActual = data.historial || [];
                    gruposGuardados = data.grupos || [];
                } else {
                    historialActual = [];
                    gruposGuardados = [];
                }
                actualizarUICompleta();
            });
            inputScanner.focus();
        }

        function sincronizarNube() {
            if (!usuarioActual) return;
            db.ref('usuarios/' + usuarioActual).set({
                historial: historialActual,
                grupos: gruposGuardados
            });
        }

        // --- LÓGICA DE ESCANEO (PRECISIÓN 13 DÍGITOS) ---
        inputScanner.addEventListener("input", () => {
            if (bloqueado) return;
            let cod = inputScanner.value.trim();
            
            if (cod.length === 13) {
                registrar(cod);
                inputScanner.value = "";
            } else if (cod.length > 13) {
                lanzarError(cod);
                inputScanner.value = "";
            }
        });

        function registrar(codigo) {
            historialActual.push(codigo);
            document.getElementById("ultimo-valor").innerText = codigo;
            sonar(800, 0.08);
            sincronizarNube();
        }

        function actualizarUICompleta() {
            document.getElementById("total").innerText = historialActual.length;
            const t = document.getElementById("tabla");
            t.innerHTML = "";
            const inicio = Math.max(0, historialActual.length - 50);
            for (let i = historialActual.length - 1; i >= inicio; i--) {
                t.innerHTML += `<tr><td>${i+1}</td><td>${historialActual[i]}</td><td><button onclick="eliminarFila(${i})" style="background:red; color:white; border:none; padding:5px; border-radius:4px;">X</button></td></tr>`;
            }
        }

        function eliminarFila(i) {
            historialActual.splice(i, 1);
            sincronizarNube();
        }

        function guardarGrupoActual() {
            if (historialActual.length === 0) return alert("Sin datos.");
            let nom = prompt("Nombre lote:", "Lote " + (gruposGuardados.length + 1));
            if (!nom) return;
            gruposGuardados.push({ nombre: nom, datos: [...historialActual] });
            historialActual = []; 
            sincronizarNube();
            toggleMenu();
        }

        function abrirModalGrupos() {
            modoModal = true;
            const lista = document.getElementById("listaGrupos");
            lista.innerHTML = "";
            gruposGuardados.forEach((g, i) => {
                lista.innerHTML += `
                    <div class="card-grupo">
                        <div style="color:white; font-size: 13px; margin-bottom:5px;"><strong>${g.nombre}</strong> (${g.datos.length} uds)</div>
                        <div style="display:flex; gap:5px;">
                            <button class="btn-accion" style="background:#3498db; flex:1;" onclick="verLecturasGrupo(${i})">VER / REANUDAR</button>
                            <button class="btn-accion" style="background:#2ecc71; flex:1;" onclick="exportarGrupo(${i})">TXT</button>
                        </div>
                    </div>`;
            });
            document.getElementById("modalGrupos").style.display = "flex";
            toggleMenu();
        }

        function verLecturasGrupo(idx) {
            idxGrupoAbierto = idx;
            const g = gruposGuardados[idx];
            document.getElementById("tituloDetalle").innerText = g.nombre;
            renderizarTablaDetalle(g.datos);
            document.getElementById("modalDetalle").style.display = "flex";
        }

        document.getElementById("btnReanudar").onclick = () => {
            const g = gruposGuardados[idxGrupoAbierto];
            historialActual = [...g.datos]; 
            gruposGuardados.splice(idxGrupoAbierto, 1);
            sincronizarNube();
            cerrarModal('modalDetalle');
            cerrarModal('modalGrupos');
        };

        function renderizarTablaDetalle(datos, filtro = "") {
            const t = document.getElementById("tablaDetalle");
            const res = document.getElementById("resumenDetalle");
            t.innerHTML = "";
            let cont = 0;
            datos.forEach((cod, i) => {
                if (filtro === "" || cod === filtro) {
                    t.innerHTML += `<tr><td>${i+1}</td><td>${cod}</td></tr>`;
                    if(filtro !== "") cont++;
                }
            });
            if (filtro !== "") {
                res.innerText = `CANTIDAD: ${cont} UNIDADES`;
                res.style.display = "block";
            } else { res.style.display = "none"; }
        }

        document.getElementById("input-buscar-lote").oninput = function() {
            if(this.value.length === 13) {
                renderizarTablaDetalle(gruposGuardados[idxGrupoAbierto].datos, this.value);
                sonar(1000, 0.1); this.value = "";
            } else if(this.value === "") { renderizarTablaDetalle(gruposGuardados[idxGrupoAbierto].datos); }
        };

        function exportarGrupo(idx) {
            let g = gruposGuardados[idx];
            let conteo = {};
            g.datos.forEach(c => conteo[c] = (conteo[c] || 0) + 1);
            let txt = "";
            Object.entries(conteo).forEach(([c, q]) => txt += `${c}|${q}\n`);
            const blob = new Blob([txt], { type: "text/plain" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `${g.nombre}.txt`; a.click();
        }

        function abrirBuscadorGeneral() {
            modoModal = true;
            document.getElementById("modalBuscadorGeneral").style.display = "flex";
            document.getElementById("input-buscar-general").focus();
            toggleMenu();
        }

        document.getElementById("input-buscar-general").oninput = function() {
            if (this.value.length === 13) {
                let cod = this.value;
                let resDiv = document.getElementById("resultadosGeneral");
                let resumen = document.getElementById("resumenGeneral");
                resDiv.innerHTML = "";
                let granTotal = 0;
                gruposGuardados.forEach(g => {
                    let items = [];
                    g.datos.forEach((c, idx) => { if(c === cod) { items.push(idx + 1); granTotal++; } });
                    if (items.length > 0) {
                        resDiv.innerHTML += `<div class="card-grupo"><span style="color:white; font-size:12px;">${g.nombre}</span><br><b style="color:#f1c40f;">ITEMS: ${items.join(", ")}</b></div>`;
                    }
                });
                resumen.innerText = "TOTAL ENCONTRADO: " + granTotal;
                resumen.style.display = granTotal > 0 ? "block" : "none";
                this.value = ""; sonar(1000, 0.1);
            }
        };

        function lanzarError(c) {
            bloqueado = true;
            document.getElementById("cod-erroneo").innerText = "CÓDIGO INVÁLIDO: " + c;
            document.getElementById("alerta-inferior").style.display = "block";
            sonar(200, 0.5);
        }

        function desbloquear() {
            bloqueado = false;
            document.getElementById("alerta-inferior").style.display = "none";
            inputScanner.value = ""; inputScanner.focus();
        }

        function toggleMenu() { document.getElementById("menuContent").classList.toggle("show"); }
        function cerrarModal(id) { document.getElementById(id).style.display = "none"; modoModal = false; inputScanner.focus(); }
        function cerrarDetalle() { document.getElementById("modalDetalle").style.display = "none"; }

        document.addEventListener("click", () => { if(!bloqueado && !modoModal && usuarioActual) inputScanner.focus(); });
    </script>
</body>
</html>
